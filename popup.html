<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page Pilot</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <h1>Page Pilot</h1>
      </div>
      <div class="header-actions">
        <label class="toggle" title="Toggle voice feedback">
          <span class="toggle-label">Voice</span>
          <span class="switch">
            <input type="checkbox" id="voiceToggle" checked>
            <span class="slider round"></span>
          </span>
        </label>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <div id="apiKeyBanner" class="banner" style="display:none;">
      <span>No Gemini API key set.</span>
      <button id="openSettingsLink" class="link-btn">Add key</button>
    </div>

    <button id="scanPage" class="primary-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <span>Scan Page</span>
    </button>

    <div id="status" class="status-indicator" role="status" aria-live="polite">Ready to scan.</div>

    <section id="summaryContainer" class="summary-container" style="display:none;">
      <div class="section-header">
        <h3>AI Summary</h3>
        <div class="section-actions">
          <button id="copySummaryBtn" class="mini-btn" title="Copy summary">Copy</button>
          <button id="speakSummaryBtn" class="mini-btn" title="Speak summary">Speak</button>
        </div>
      </div>
      <p id="summaryText"></p>
    </section>

    <section class="results-container">
      <div class="results-header">
        <span>Detected Elements</span>
        <div class="results-header-right">
          <input id="filterInput" class="filter-input" type="search" placeholder="Filter…" aria-label="Filter elements">
          <span id="badge" class="badge">0</span>
        </div>
      </div>
      <div class="chip-row" id="chipRow"></div>
      <ul id="actionsList" class="actions-list">
        <li class="empty-state">Click 'Scan' to analyze the current page.</li>
      </ul>
      <div class="results-footer">
        <button id="exportBtn" class="mini-btn" title="Export elements as JSON">Export JSON</button>
        <button id="clearBtn" class="mini-btn" title="Clear results">Clear</button>
      </div>
    </section>

    <!-- Settings panel -->
    <section id="settingsPanel" class="panel" style="display:none;">
      <div class="panel-header">
        <h3>Settings</h3>
        <button id="closeSettings" class="icon-btn" aria-label="Close settings">✕</button>
      </div>

      <div class="field-group">
        <label for="apiKeyInput">Gemini API Key</label>
        <div class="api-key-row">
          <input id="apiKeyInput" class="input-field" type="password" placeholder="AIza..." autocomplete="off">
          <button id="toggleKeyVisibility" class="mini-btn" type="button">Show</button>
        </div>
        <div class="btn-row">
          <button id="saveKeyBtn" class="secondary-btn">Save</button>
          <button id="testKeyBtn" class="secondary-btn">Test</button>
          <button id="clearKeyBtn" class="secondary-btn danger">Clear</button>
        </div>
        <p class="help-text">Stored locally in your browser. Get a key from Google AI Studio.</p>
      </div>

      <div class="field-group">
        <label for="modelSelect">Model</label>
        <select id="modelSelect" class="input-field">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (recommended)</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite (faster)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (thorough)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (newest)</option>
          <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
          <option value="gemini-flash-latest">Gemini Flash (latest)</option>
        </select>
      </div>

      <div class="field-group">
        <label for="styleSelect">Summary style</label>
        <select id="styleSelect" class="input-field">
          <option value="concise">Concise (spoken)</option>
          <option value="detailed">Detailed</option>
          <option value="bullets">Bullet list</option>
        </select>
      </div>

      <div class="field-group">
        <label for="voiceSelect">Voice</label>
        <select id="voiceSelect" class="input-field"></select>
      </div>

      <div class="field-group">
        <label for="rateRange">Speech rate: <span id="rateValue">1.0</span></label>
        <input id="rateRange" type="range" min="0.5" max="2" step="0.1" value="1">
      </div>

      <div class="field-group">
        <label for="maxElementsInput">Max elements to scan</label>
        <input id="maxElementsInput" class="input-field" type="number" min="10" max="200" value="80">
      </div>

      <div class="field-group">
        <label for="highlightDurationInput">Highlight duration (ms)</label>
        <input id="highlightDurationInput" class="input-field" type="number" min="500" max="10000" step="100" value="2500">
      </div>
    </section>

    <!-- History panel -->
    <section id="historyPanel" class="panel" style="display:none;">
      <div class="panel-header">
        <h3>Recent Scans</h3>
        <button id="closeHistory" class="icon-btn" aria-label="Close history">✕</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <div class="btn-row">
        <button id="clearHistoryBtn" class="secondary-btn danger">Clear history</button>
      </div>
    </section>

    <footer class="footer">
      <button id="historyBtn" class="footer-btn">History</button>
      <span class="footer-note">Page Pilot v2.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
